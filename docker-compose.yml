# PostgreSQL + pgvector for DevPilot's production-style RAG backend.
#   docker compose up -d
# Then set VECTOR_BACKEND=pgvector in your .env and run the API.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: devpilot-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devpilot}
      POSTGRES_USER: ${POSTGRES_USER:-devpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devpilot_pgdata:/var/lib/postgresql/data
      # schema.sql runs automatically on first boot of a fresh volume
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devpilot_pgdata:
