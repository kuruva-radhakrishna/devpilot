# Render Blueprint for the DevPilot backend (Docker web service).
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo. Then set the
# two secret env vars (GEMINI_API_KEY, ALLOWED_ORIGINS) in the dashboard.
services:
  - type: web
    name: devpilot-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY        # your AIza... key — paste in the dashboard
        sync: false
      - key: ALLOWED_ORIGINS       # set to your Vercel URL, e.g. https://devpilot.vercel.app
        sync: false
      - key: DATABASE_URL          # Postgres for the login user store (Supabase/Render PG)
        sync: false
      - key: JWT_SECRET            # signs login sessions — generated, kept secret
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SANDBOX_BACKEND
        value: local
      - key: VECTOR_BACKEND
        value: memory
      - key: TRACE_ENABLED
        value: "true"
