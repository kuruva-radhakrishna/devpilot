# Render Blueprint for the DevPilot backend (Docker web service).
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo. Then set the
# two secret env vars (GEMINI_API_KEY, ALLOWED_ORIGINS) in the dashboard.
services:
  - type: web
    name: devpilot-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY        # your AIza... key — paste in the dashboard
        sync: false
      - key: ALLOWED_ORIGINS       # set to your Vercel URL, e.g. https://devpilot.vercel.app
        sync: false
      - key: DATABASE_URL          # Postgres: user accounts, repo/chat persistence, and
        sync: false                # (with VECTOR_BACKEND=pgvector) the embedded chunks themselves
      - key: JWT_SECRET            # signs login sessions — generated, kept secret
        generateValue: true
      - key: FRONTEND_URL          # where emailed password-reset links point
        value: https://devpilot-ruby.vercel.app
      # To turn on "Forgot password", also set BREVO_API_KEY and MAIL_FROM in the Render
      # dashboard (see DEPLOY.md). They aren't listed here on purpose: a secret-less
      # `sync: false` entry makes a Blueprint sync wait for input.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SANDBOX_BACKEND       # no Docker daemon on Render, so repo tests run on the
        value: remote              # separate, secret-free devpilot-runner service below
      - key: SANDBOX_TOKEN         # the runner's token, shared automatically
        fromService:
          type: web
          name: devpilot-runner
          envVarKey: RUNNER_TOKEN
      # SANDBOX_URL (the runner's public https address) is set in the dashboard once the
      # runner is up. It is deliberately not guessed here: the token and every uploaded
      # workspace go to that address, so it must be one you've confirmed is yours.
      - key: VECTOR_BACKEND
        value: pgvector
      - key: TRACE_ENABLED
        value: "true"

  # The isolated test runner. It holds NO secrets (only its own token), runs each test
  # suite as an unprivileged per-slot user with resource limits, and refuses to run
  # anything if it can't isolate. See runner/ and DEPLOY.md.
  - type: web
    name: devpilot-runner
    runtime: docker
    dockerContext: ./runner
    dockerfilePath: ./runner/Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: RUNNER_TOKEN
        generateValue: true
      - key: RUNNER_SLOTS          # one run at a time: the free instance has 512 MB, and a
        value: "1"                 # Node or Go test run can use a large share of it
