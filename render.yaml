# Render Blueprint for the DevPilot backend (Docker web service).
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo. Then set the
# two secret env vars (GEMINI_API_KEY, ALLOWED_ORIGINS) in the dashboard.
services:
  - type: web
    name: devpilot-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY        # your AIza... key — paste in the dashboard
        sync: false
      - key: ALLOWED_ORIGINS       # set to your Vercel URL, e.g. https://devpilot.vercel.app
        sync: false
      - key: DATABASE_URL          # Postgres: user accounts, repo/chat persistence, and
        sync: false                # (with VECTOR_BACKEND=pgvector) the embedded chunks themselves
      - key: JWT_SECRET            # signs login sessions — generated, kept secret
        generateValue: true
      - key: FRONTEND_URL          # where emailed password-reset links point
        value: https://devpilot-ruby.vercel.app
      # To turn on "Forgot password", also set BREVO_API_KEY and MAIL_FROM in the Render
      # dashboard (see DEPLOY.md). They aren't listed here on purpose: a secret-less
      # `sync: false` entry makes a Blueprint sync wait for input.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SANDBOX_BACKEND       # no Docker daemon on Render. With DATABASE_URL set the
        value: local               # app REFUSES to run repo tests under "local" (see DEPLOY.md)
      - key: VECTOR_BACKEND
        value: pgvector
      - key: TRACE_ENABLED
        value: "true"
